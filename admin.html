<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - الأطباء</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    form {
      background-color: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .doctor-list {
      background-color: white;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .doctor-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .doctor-item:last-child {
      border-bottom: none;
    }
    .delete-btn {
      background-color: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>لوحة التحكم - إدارة الأطباء</h1>

  <form id="addDoctorForm">
    <input type="text" id="doctorName" placeholder="اسم الطبيب" required>
    <input type="text" id="specialty" placeholder="التخصص" required>
    <input type="text" id="phone" placeholder="رقم الهاتف" required>
    <button type="submit">إضافة الطبيب</button>
  </form>

  <div class="doctor-list" id="doctorList"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
