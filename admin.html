<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - الأطباء</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    form {
      background-color: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .doctor-list {
      background-color: white;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .doctor-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .doctor-item:last-child {
      border-bottom: none;
    }
    .delete-btn {
      background-color: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>لوحة التحكم - إدارة الأطباء</h1>

  <form id="addDoctorForm">
    <input type="text" id="doctorName" placeholder="اسم الطبيب" required>
    <input type="text" id="specialty" placeholder="التخصص" required>
    <input type="text" id="phone" placeholder="رقم الهاتف" required>
    <button type="submit">إضافة الطبيب</button>
  </form>

  <div class="doctor-list" id="doctorList"></div>

  <script type="module" src="script.js"></script>
  <!-- Firebase -->
<script type="module">
  // Import Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // إعداد Firebase الخاص بمشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyDgxnMz1IyXQ9hn9VXKJpPGLf75JUNeIYs",
    authDomain: "doctor-booking-system-336f6.firebaseapp.com",
    projectId: "doctor-booking-system-336f6",
    storageBucket: "doctor-booking-system-336f6.firebasestorage.app",
    messagingSenderId: "996057125969",
    appId: "1:996057125969:web:332550171352c0950ad470",
  };

  // نبدأ الاتصال بفايربيز
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // العناصر
  const saveBtn = document.getElementById("saveDoctor");
  const list = document.getElementById("doctorsList");

  // عند حفظ الطبيب
  saveBtn.addEventListener("click", async () => {
    const name = document.getElementById("docName").value;
    const specialty = document.getElementById("docSpecialty").value;
    const area = document.getElementById("docArea").value;
    const price = document.getElementById("docPrice").value;
    const img = document.getElementById("docImg").value;
    const schedule = document.getElementById("docSchedule").value;

    if (!name || !specialty) {
      alert("يرجى إدخال اسم الطبيب والتخصص ✏️");
      return;
    }

    await addDoc(collection(db, "doctors"), {
      name,
      specialty,
      area,
      price,
      img,
      schedule,
    });

    alert("✅ تم إضافة الطبيب بنجاح!");
    loadDoctors();
  });

  // تحميل الأطباء من فايربيز
  async function loadDoctors() {
    list.innerHTML = "";
    const querySnapshot = await getDocs(collection(db, "doctors"));
    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const div = document.createElement("div");
      div.classList.add("doctor-item");
      div.innerHTML = `
        <p><strong>${data.name}</strong> - ${data.specialty}</p>
        <button onclick="deleteDoctor('${docSnap.id}')">🗑️ حذف</button>
      `;
      list.appendChild(div);
    });
  }

  // حذف الطبيب
  window.deleteDoctor = async (id) => {
    await deleteDoc(doc(db, "doctors", id));
    alert("🗑️ تم حذف الطبيب");
    loadDoctors();
  };

  loadDoctors();
</script>
</body>
</html>
