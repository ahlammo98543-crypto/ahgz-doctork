<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - إدارة الأطباء</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background-color: #f8f9fa;
      direction: rtl;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #007bff;
    }
    form {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 20px auto;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .doctor-list {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .doctor-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .doctor-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <h1>🩺 إدارة الأطباء</h1>

  <form id="doctorForm">
    <input type="text" id="name" placeholder="اسم الطبيب" required />
    <input type="text" id="specialty" placeholder="تخصص الطبيب" required />
    <input type="number" id="price" placeholder="سعر الكشف" required />
    <textarea id="description" placeholder="نبذة عن الطبيب" required></textarea>
    <input type="tel" id="phone" placeholder="رقم الهاتف" required />
    <input type="text" id="days" placeholder="أيام العمل (مثلاً: السبت - الاثنين - الأربعاء)" required />
    <button type="submit">إضافة الطبيب</button>
  </form>

  <div class="doctor-list">
    <h3>📋 قائمة الأطباء</h3>
    <div id="list"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgxnMz1IyXQ9hn9VXKJpPGLf75JUNeIYs",
      authDomain: "doctor-booking-system-336f6.firebaseapp.com",
      projectId: "doctor-booking-system-336f6",
      storageBucket: "doctor-booking-system-336f6.appspot.com",
      messagingSenderId: "996057125969",
      appId: "1:996057125969:web:332550171352c0950ad470"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("doctorForm");
    const listContainer = document.getElementById("list");

    // تحميل الأطباء عند الفتح
    window.addEventListener("DOMContentLoaded", loadDoctors);

    // إضافة طبيب جديد
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const specialty = document.getElementById("specialty").value.trim();
      const price = document.getElementById("price").value.trim();
      const description = document.getElementById("description").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const days = document.getElementById("days").value.trim();

      if (!name || !specialty || !price || !description || !phone || !days) {
        alert("من فضلك املأ كل البيانات");
        return;
      }

      await addDoc(collection(db, "doctors"), {
        name, specialty, price, description, phone, days
      });

      form.reset();
      loadDoctors();
    });

    // تحميل قائمة الأطباء
    async function loadDoctors() {
      listContainer.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "doctors"));
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.className = "doctor-item";
        div.innerHTML = `
          <strong>${data.name}</strong> - ${data.specialty}<br>
          💵 ${data.price} جنيه<br>
          📞 ${data.phone}<br>
          🗓️ ${data.days}<br>
          📝 ${data.description}<br>
          <button data-id="${docSnap.id}" class="delete-btn">🗑️ حذف</button>
        `;
        listContainer.appendChild(div);
      });

      // تفعيل أزرار الحذف
      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const id = e.target.dataset.id;
          await deleteDoc(doc(db, "doctors", id));
          loadDoctors();
        });
      });
    }
  </script>
</body>
</html>
