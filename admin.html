<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>لوحة إدارة الأطباء 👩‍⚕️</h1>

    <div class="form-row">
      <input id="docName" placeholder="اسم الدكتور">
      <input id="docSpecialty" placeholder="التخصص">
      <input id="docArea" placeholder="العنوان">
      <input id="docPrice" type="number" placeholder="السعر">
      <input id="docImg" placeholder="رابط الصورة">
      <button id="saveDoctor" class="btn">💾 حفظ</button>
    </div>

    <h3>قائمة الأطباء</h3>
    <ul id="doctorList"></ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // 🔥 إعداد Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDgxnMz1IyXQ9hn9VXKJpPGLf75JUNeIYs",
      authDomain: "doctor-booking-system-336f6.firebaseapp.com",
      projectId: "doctor-booking-system-336f6",
      storageBucket: "doctor-booking-system-336f6.firebasestorage.app",
      messagingSenderId: "996057125969",
      appId: "1:996057125969:web:56691f690dde716d0ad470"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const nameInput = document.getElementById("docName");
    const specialtyInput = document.getElementById("docSpecialty");
    const areaInput = document.getElementById("docArea");
    const priceInput = document.getElementById("docPrice");
    const imgInput = document.getElementById("docImg");
    const saveBtn = document.getElementById("saveDoctor");
    const doctorList = document.getElementById("doctorList");

    async function loadDoctors() {
      doctorList.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "doctors"));
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const li = document.createElement("li");
        li.textContent = `${data.name} — ${data.specialty} — ${data.area}`;
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑️ حذف";
        delBtn.onclick = async () => {
          await deleteDoc(doc(db, "doctors", docSnap.id));
          loadDoctors();
        };
        li.appendChild(delBtn);
        doctorList.appendChild(li);
      });
    }

    saveBtn.addEventListener("click", async () => {
      if (!nameInput.value.trim()) return alert("اكتبي اسم الدكتور");
      await addDoc(collection(db, "doctors"), {
        name: nameInput.value,
        specialty: specialtyInput.value,
        area: areaInput.value,
        price: priceInput.value,
        img: imgInput.value
      });
      nameInput.value = specialtyInput.value = areaInput.value = priceInput.value = imgInput.value = "";
      loadDoctors();
    });

    loadDoctors();
  </script>
</body>
</html>
