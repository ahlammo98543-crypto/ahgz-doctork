<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الإدارة — Admin</title>
  <style>
    body { font-family: "Cairo", sans-serif; background-color: #f5f7fa; margin:0; color:#222; }
    .login-screen { display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; background:linear-gradient(135deg,#007bff,#004aad); color:white; text-align:center; }
    .login-screen input { padding:10px; border-radius:8px; width:260px; margin-top:12px; border:none; }
    .login-screen button { background:white; color:#004aad; padding:10px 18px; border-radius:8px; margin-top:12px; border:none; font-weight:700; cursor:pointer; }
    .topbar { background:#004aad; color:white; display:flex; justify-content:space-between; align-items:center; padding:15px 20px; }
    .topbar .logout { background:white; color:#004aad; padding:8px 14px; border-radius:8px; border:none; cursor:pointer; font-weight:700; }
    .container{max-width:1100px;margin:20px auto;padding:0 16px}
    .card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 10px 30px rgba(11,82,150,0.06)}
    .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
    input[type="text"], input[type="number"]{padding:8px;border-radius:8px;border:1px solid #e6eefc;flex:1}
    button.btn{background:#007bff;color:white;padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700}
    .btn.ghost{background:#ccc;color:#333}
    .muted{color:#667085;font-size:13px}
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="login-screen" id="loginScreen">
    <h2>🔒 دخول لوحة الإدارة</h2>
    <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور">
    <button id="loginBtn">دخول</button>
    <p id="loginError" style="color:yellow;margin-top:10px"></p>
  </div>

  <!-- لوحة الإدارة -->
  <div id="adminPanel" style="display:none;">
    <header class="topbar">
      <h1>لوحة الإدارة</h1>
      <button class="logout" id="logoutBtn">تسجيل الخروج</button>
    </header>

    <main class="container">
      <section class="card">
        <h3>إضافة / تعديل طبيب</h3>

        <div class="form-row">
          <input id="docName" placeholder="اسم الدكتور">
          <input id="docSpecialty" placeholder="التخصص">
        </div>

        <div class="form-row">
          <input id="docArea" placeholder="المنطقة / العنوان">
          <input id="docPrice" type="number" placeholder="سعر الكشف">
        </div>

        <div class="form-row">
          <input id="docImg" placeholder="رابط الصورة (اختياري)">
          <input id="docSchedule" placeholder="المواعيد (مثال: الأحد والثلاثاء 5-9)">
        </div>

        <div class="form-row">
          <button id="saveDoctor" class="btn">💾 حفظ</button>
          <button id="clearForm" class="btn ghost">🧹 مسح</button>
        </div>

        <div id="statusMsg" class="muted"></div>
      </section>

      <section class="card">
        <h3>قائمة الأطباء</h3>
        <ul id="doctorsList"></ul>
      </section>
    </main>

    <footer style="text-align:center;margin-top:20px;color:#777;">
      © <span id="yearAdmin"></span> Admin
    </footer>
  </div>

  <!-- كود JavaScript -->
  <script type="module">
    // Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // Config من مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyDgxnMz1IyXQ9hn9VXKJpPGLf75JUNeIYs",
      authDomain: "doctor-booking-system-336f6.firebaseapp.com",
      projectId: "doctor-booking-system-336f6",
      storageBucket: "doctor-booking-system-336f6.firebasestorage.app",
      messagingSenderId: "996057125969",
      appId: "1:996057125969:web:56691f690dde716d0ad470",
      measurementId: "G-DVWG04KC1X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // عناصر الصفحة
    const saveBtn = document.getElementById("saveDoctor");
    const clearBtn = document.getElementById("clearForm");
    const statusMsg = document.getElementById("statusMsg");
    const doctorsList = document.getElementById("doctorsList");

    // تسجيل الدخول
    const correctPassword = "Ahlammohamed2003";
    const loginScreen = document.getElementById("loginScreen");
    const adminPanel = document.getElementById("adminPanel");
    document.getElementById("loginBtn").onclick = () => {
      if (document.getElementById("adminPassword").value === correctPassword) {
        loginScreen.style.display = "none";
        adminPanel.style.display = "block";
      } else {
        document.getElementById("loginError").textContent = "❌ كلمة المرور غير صحيحة";
      }
    };
    document.getElementById("logoutBtn").onclick = () => location.reload();

    // حفظ الدكتور
    saveBtn.onclick = async () => {
      const name = docName.value.trim();
      const specialty = docSpecialty.value.trim();
      const area = docArea.value.trim();
      const price = docPrice.value.trim();
      const img = docImg.value.trim() || "https://via.placeholder.com/150";
      const schedule = docSchedule.value.trim();

      if (!name || !specialty || !area || !price) {
        statusMsg.textContent = "⚠️ من فضلك املأ كل البيانات المطلوبة";
        return;
      }

      await addDoc(collection(db, "doctors"), {
        name, specialty, area, price, img, schedule
      });

      statusMsg.textContent = "✅ تم حفظ الطبيب بنجاح!";
      loadDoctors();
      clearForm();
    };

    // تحميل قائمة الدكاترة
    async function loadDoctors() {
      doctorsList.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "doctors"));
      querySnapshot.forEach(doc => {
        const data = doc.data();
        const li = document.createElement("li");
        li.textContent = `${data.name} — ${data.specialty} (${data.area})`;
        doctorsList.appendChild(li);
      });
    }

    function clearForm() {
      docName.value = docSpecialty.value = docArea.value = docPrice.value = docImg.value = docSchedule.value = "";
    }

    loadDoctors();
    document.getElementById("yearAdmin").textContent = new Date().getFullYear();
  </script>
</body>
</html>
