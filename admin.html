<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة - إدارة الأطباء</title>
  <style>
    body { font-family: "Cairo", sans-serif; background: #f7f7f7; text-align: center; padding: 30px; }
    h1 { color: #2c3e50; }
    form { background: white; padding: 20px; border-radius: 10px; display: inline-block; margin-bottom: 30px; }
    input { margin: 10px; padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 20px; border: none; border-radius: 5px; background-color: #3498db; color: white; cursor: pointer; }
    button:hover { background-color: #2980b9; }
    .doctor-card { background: white; border-radius: 10px; padding: 15px; margin: 10px auto; width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .delete-btn { background: #e74c3c; margin-top: 10px; }
    .delete-btn:hover { background: #c0392b; }
  </style>
</head>
<body>
  <h1>لوحة الإدارة - إدارة الأطباء</h1>

  <form id="doctorForm">
    <input type="text" id="name" placeholder="اسم الدكتور" required /><br />
    <input type="text" id="specialty" placeholder="التخصص" required /><br />
    <input type="text" id="phone" placeholder="رقم الهاتف" required /><br />
    <button type="submit">➕ حفظ</button>
  </form>

  <h2>قائمة الأطباء</h2>
  <div id="doctorList"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgxnMz1IyXQ9hn9VXKJpPGLf75JUNeIYs",
      authDomain: "doctor-booking-system-336f6.firebaseapp.com",
      projectId: "doctor-booking-system-336f6",
      storageBucket: "doctor-booking-system-336f6.firebasestorage.app",
      messagingSenderId: "996057125969",
      appId: "1:996057125969:web:56691f690dde716d0ad470",
      measurementId: "G-DVWG04KC1X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🔹 حفظ الدكتور
    const form = document.getElementById("doctorForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const specialty = document.getElementById("specialty").value;
      const phone = document.getElementById("phone").value;

      try {
        await addDoc(collection(db, "doctors"), { name, specialty, phone });
        alert("✅ تم حفظ بيانات الدكتور بنجاح!");
        form.reset();
        loadDoctors();
      } catch (error) {
        alert("❌ حدث خطأ أثناء الحفظ: " + error.message);
      }
    });

    // 🔹 عرض الأطباء
    async function loadDoctors() {
      const doctorList = document.getElementById("doctorList");
      doctorList.innerHTML = "";

      const querySnapshot = await getDocs(collection(db, "doctors"));
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.classList.add("doctor-card");
        div.innerHTML = `
          <h3>${data.name}</h3>
          <p><strong>التخصص:</strong> ${data.specialty}</p>
          <p><strong>الهاتف:</strong> ${data.phone}</p>
          <button class="delete-btn" data-id="${docSnap.id}">🗑️ حذف</button>
        `;
        doctorList.appendChild(div);
      });

      // 🔹 زر الحذف
      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const id = e.target.getAttribute("data-id");
          if (confirm("هل أنت متأكد من حذف هذا الدكتور؟")) {
            await deleteDoc(doc(db, "doctors", id));
            alert("تم حذف الدكتور بنجاح!");
            loadDoctors();
          }
        });
      });
    }

    loadDoctors();
  </script>
</body>
</html>
