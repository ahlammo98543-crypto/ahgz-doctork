<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>احجز دكتورك</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #007bff;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }
    .doctor-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    .doctor-card h3 {
      margin: 0;
      color: #007bff;
    }
    .doctor-card p {
      margin: 5px 0;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <header>🩺 احجز دكتورك</header>

  <div class="container" id="doctorsContainer">
    <h2>قائمة الأطباء المتاحين</h2>
    <div id="doctorsList">جارٍ التحميل...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgxnMz1IyXQ9hn9VXKJpPGLf75JUNeIYs",
      authDomain: "doctor-booking-system-336f6.firebaseapp.com",
      projectId: "doctor-booking-system-336f6",
      storageBucket: "doctor-booking-system-336f6.firebasestorage.app",
      messagingSenderId: "996057125969",
      appId: "1:996057125969:web:332550171352c0950ad470"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const listContainer = document.getElementById("doctorsList");

    async function loadDoctors() {
      listContainer.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "doctors"));
      if (querySnapshot.empty) {
        listContainer.innerHTML = "<p>لا يوجد أطباء حاليًا.</p>";
        return;
      }
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.className = "doctor-card";
        div.innerHTML = `
          <h3>${data.name}</h3>
          <p><strong>التخصص:</strong> ${data.specialty}</p>
          <p><strong>السعر:</strong> ${data.price} جنيه</p>
          <p><strong>📞 رقم الهاتف:</strong> ${data.phone}</p>
          <p><strong>🗓️ المواعيد:</strong> ${data.days}</p>
          <p><strong>نبذة:</strong> ${data.description}</p>
          <button>احجز الآن</button>
        `;
        listContainer.appendChild(div);
      });
    }

    loadDoctors();
  </script>
</body>
</html>
