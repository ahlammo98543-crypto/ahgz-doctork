<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>احجز دكتورك الآن</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 20px 0;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .doctor-card {
      border-bottom: 1px solid #eee;
      padding: 15px 10px;
      text-align: right;
    }
    .doctor-card:last-child {
      border-bottom: none;
    }
    h2 {
      color: #007bff;
      margin-bottom: 5px;
    }
    .price {
      color: green;
      font-weight: bold;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <header>💙 احجز دكتورك الآن</header>

  <div class="container" id="doctorsContainer">
    <h1>قائمة الأطباء المتاحين</h1>
    <div id="doctorList">جاري التحميل...</div>
  </div>

  <script type="module">
    // Firebase setup
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgxnMz1IyXQ9hn9VXKJpPGLf75JUNeIYs",
      authDomain: "doctor-booking-system-336f6.firebaseapp.com",
      projectId: "doctor-booking-system-336f6",
      storageBucket: "doctor-booking-system-336f6.firebasestorage.app",
      messagingSenderId: "996057125969",
      appId: "1:996057125969:web:332550171352c0950ad470"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const doctorList = document.getElementById("doctorList");

    async function loadDoctors() {
      doctorList.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "doctors"));
      if (querySnapshot.empty) {
        doctorList.innerHTML = "<p>لا يوجد أطباء حالياً.</p>";
      } else {
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "doctor-card";
          div.innerHTML = `
            <h2>${data.name}</h2>
            <p><strong>التخصص:</strong> ${data.specialty}</p>
            <p class="price">💰 ${data.price} جنيه</p>
            <p><strong>📞 الهاتف:</strong> ${data.phone}</p>
            <p><strong>🗓️ الأيام:</strong> ${data.days}</p>
            <p><strong>📝 نبذة:</strong> ${data.description}</p>
            <button>احجز الآن</button>
          `;
          doctorList.appendChild(div);
        });
      }
    }

    loadDoctors();
  </script>
</body>
</html>
