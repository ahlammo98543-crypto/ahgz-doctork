    <circle cx="56" cy="56" r="48" fill="#E9F6FF"/>
    <!-- جسم السماعة -->
    <path d="M56 16 C72 16 84 28 84 44 L84 120 C84 148 108 168 132 164 C156 160 176 136 176 112" stroke="#0077B6" stroke-width="8" stroke-linecap="round" fill="none"/>
