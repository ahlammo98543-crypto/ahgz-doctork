<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="احجز دكتورك | Book Your Doctor">
  <!-- خلفية شفافة -->
  <rect width="1200" height="360" fill="transparent"/>

  <!-- أيقونة سماعة (رمز بسيط وأنيق) -->
