    <text x="0" y="0" font-family="Cairo, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Naskh Arabic', Arial" font-weight="800" font-size="64" fill="#073b4c">احجز دكتورك</text>
    <text x="0" y="68" font-family="Cairo, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Naskh Arabic', Arial" font-weight="600" font-size="22" fill="#1f6f8b">Book Your Doctor</text>
